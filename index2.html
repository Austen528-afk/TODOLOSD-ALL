<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>StreamX Admin</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:white;
    min-height:100vh;
}

header{
    padding:20px 5%;
    border-bottom:1px solid #292929;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#101010;
}

.logo{
    font-size:27px;
    font-weight:900;
}

.logo span{
    color:#ff1744;
}

.user-site{
    text-decoration:none;
    color:#aaa;
    font-size:13px;
}

.user-site:hover{
    color:white;
}

.container{
    width:90%;
    max-width:1200px;
    margin:35px auto;
}

.heading{
    margin-bottom:30px;
}

.heading h1{
    font-size:32px;
}

.heading p{
    color:#777;
    margin-top:8px;
}

.panel{
    background:#151515;
    border:1px solid #292929;
    border-radius:14px;
    padding:25px;
    margin-bottom:25px;
}

.panel h2{
    font-size:20px;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:#bbb;
    font-size:13px;
    margin-bottom:8px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    background:#0d0d0d;
    border:1px solid #333;
    border-radius:8px;
    color:white;
    outline:none;
    font-family:inherit;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#ff1744;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.file-box{
    border:1px dashed #444;
    border-radius:10px;
    padding:25px;
    text-align:center;
    background:#101010;
}

.file-box input{
    margin-top:15px;
    border:none;
    padding:0;
}

.preview{
    margin-top:15px;
    max-width:300px;
    max-height:180px;
    display:none;
    border-radius:8px;
}

.actions{
    margin-top:22px;
    display:flex;
    gap:10px;
}

button{
    border:none;
    cursor:pointer;
}

.upload{
    background:#ff1744;
    color:white;
    padding:13px 25px;
    border-radius:8px;
    font-weight:bold;
}

.upload:hover{
    background:#e50034;
}

.upload:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.clear{
    background:#242424;
    color:white;
    padding:13px 20px;
    border-radius:8px;
}

.progress{
    margin-top:20px;
    display:none;
}

.progress-track{
    height:8px;
    background:#292929;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#ff1744;
}

.progress-text{
    color:#777;
    font-size:12px;
    margin-bottom:8px;
}

.library{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(250px,1fr));
    gap:18px;
}

.card{
    background:#101010;
    border:1px solid #292929;
    border-radius:10px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    background:#222;
}

.card-body{
    padding:15px;
}

.card-body h3{
    font-size:15px;
    margin-bottom:8px;
}

.card-body p{
    color:#777;
    font-size:11px;
    line-height:1.5;
}

.delete{
    margin-top:13px;
    background:#252525;
    color:white;
    padding:8px 12px;
    border-radius:6px;
}

.delete:hover{
    background:#a90025;
}

.empty{
    color:#666;
    text-align:center;
    padding:40px;
}

.status{
    margin-top:15px;
    font-size:12px;
    color:#777;
}

.success{
    color:#21c477;
}

.error{
    color:#ff4d6d;
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .container{
        width:94%;
    }

    .actions{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<header>

```
<div class="logo">
    Stream<span>X</span>
</div>

<a
    href="index.html"
    class="user-site"
>
    🌐 Open User Website
</a>
```

</header>

<main class="container">

```
<div class="heading">

    <h1>
        Content Dashboard
    </h1>

    <p>
        Upload and manage videos available
        on the StreamX user website.
    </p>

</div>


<!-- UPLOAD -->

<section class="panel">

    <h2>
        Upload New Video
    </h2>

    <div class="form-grid">


        <div>

            <label>
                Video Title
            </label>

            <input
                type="text"
                id="title"
                placeholder="Enter video title"
            >

        </div>


        <div>

            <label>
                Category
            </label>

            <select id="category">

                <option value="">
                    Select category
                </option>

                <option value="Trending">
                    Trending
                </option>

                <option value="Entertainment">
                    Entertainment
                </option>

                <option value="Music">
                    Music
                </option>

                <option value="Sports">
                    Sports
                </option>

                <option value="Gaming">
                    Gaming
                </option>

                <option value="Education">
                    Education
                </option>

                <option value="Lifestyle">
                    Lifestyle
                </option>

            </select>

        </div>


        <div class="full">

            <label>
                Description
            </label>

            <textarea
                id="description"
                placeholder="Describe the video..."
            ></textarea>

        </div>


        <div>

            <label>
                Video File
            </label>

            <div class="file-box">

                🎬

                <br>

                <strong>
                    Select Video
                </strong>

                <input
                    type="file"
                    id="video"
                    accept="video/*"
                >

            </div>

        </div>


        <div>

            <label>
                Thumbnail
            </label>

            <div class="file-box">

                🖼️

                <br>

                <strong>
                    Select Thumbnail
                </strong>

                <input
                    type="file"
                    id="thumbnail"
                    accept="image/*"
                >

                <img
                    id="thumbnailPreview"
                    class="preview"
                >

            </div>

        </div>

    </div>


    <div class="actions">

        <button
            class="upload"
            id="uploadButton"
            onclick="uploadVideo()"
        >
            ⬆ Upload Video
        </button>

        <button
            class="clear"
            onclick="clearForm()"
        >
            Clear
        </button>

    </div>


    <div
        class="progress"
        id="progress"
    >

        <div class="progress-text">
            <span id="progressText">
                Uploading...
            </span>

            <span id="percent">
                0%
            </span>
        </div>

        <div class="progress-track">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

    </div>


    <div
        class="status"
        id="status"
    ></div>

</section>


<!-- LIBRARY -->

<section class="panel">

    <h2>
        Video Library
    </h2>

    <div
        class="library"
        id="library"
    ></div>

    <div
        class="empty"
        id="empty"
    >
        No videos uploaded yet.
    </div>

</section>
```

</main>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
"https://ynmplvnclmolwwvfjidw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bh7lgrjmQioS58n3-4LdvQ_TAGHCMfy";


/* ==========================================
   ELEMENTS
========================================== */

const videoInput =
    document.getElementById("video");

const thumbnailInput =
    document.getElementById("thumbnail");


/* ==========================================
   THUMBNAIL PREVIEW
========================================== */

thumbnailInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;

        const reader =
            new FileReader();

        reader.onload =
            function(e){

                const preview =
                    document.getElementById(
                        "thumbnailPreview"
                    );

                preview.src =
                    e.target.result;

                preview.style.display =
                    "block";

            };

        reader.readAsDataURL(file);

    }
);


/* ==========================================
   UPLOAD
========================================== */

async function uploadVideo(){

    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const category =
        document.getElementById(
            "category"
        ).value;


    const description =
        document.getElementById(
            "description"
        ).value.trim();


    const video =
        videoInput.files[0];


    const thumbnail =
        thumbnailInput.files[0];


    const button =
        document.getElementById(
            "uploadButton"
        );


    const status =
        document.getElementById(
            "status"
        );


    if(!title){

        alert(
            "Enter a video title."
        );

        return;

    }


    if(!category){

        alert(
            "Select a category."
        );

        return;

    }


    if(!video){

        alert(
            "Select a video."
        );

        return;

    }


    button.disabled =
        true;


    status.textContent =
        "Preparing upload...";

    status.className =
        "status";


    document.getElementById(
        "progress"
    ).style.display =
        "block";


    try{

        /* --------------------------------
           UNIQUE FILE NAMES
        -------------------------------- */

        const id =
            crypto.randomUUID();


        const videoExtension =
            video.name
                .split(".")
                .pop()
                .toLowerCase();


        const videoPath =
            id +
            "." +
            videoExtension;


        /* --------------------------------
           UPLOAD VIDEO
        -------------------------------- */

        setProgress(
            15,
            "Uploading video..."
        );


        const videoResponse =
            await fetch(

                SUPABASE_URL +
                "/storage/v1/object/videos/" +
                videoPath,

                {
                    method:"POST",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            video.type,

                        "x-upsert":
                            "false"
                    },

                    body:video

                }

            );


        if(!videoResponse.ok){

            throw new Error(
                await videoResponse.text()
            );

        }


        /* --------------------------------
           VIDEO URL
        -------------------------------- */

        const videoURL =
            SUPABASE_URL +
            "/storage/v1/object/public/videos/" +
            videoPath;


        /* --------------------------------
           THUMBNAIL
        -------------------------------- */

        let thumbnailURL =
            null;


        if(thumbnail){

            setProgress(
                55,
                "Uploading thumbnail..."
            );


            const thumbnailExtension =
                thumbnail.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const thumbnailPath =
                id +
                "." +
                thumbnailExtension;


            const thumbnailResponse =
                await fetch(

                    SUPABASE_URL +
                    "/storage/v1/object/thumbnails/" +
                    thumbnailPath,

                    {
                        method:"POST",

                        headers:{
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY,

                            "Content-Type":
                                thumbnail.type,

                            "x-upsert":
                                "false"
                        },

                        body:thumbnail

                    }

                );


            if(!thumbnailResponse.ok){

                throw new Error(
                    await thumbnailResponse.text()
                );

            }


            thumbnailURL =
                SUPABASE_URL +
                "/storage/v1/object/public/thumbnails/" +
                thumbnailPath;

        }


        /* --------------------------------
           DATABASE
        -------------------------------- */

        setProgress(
            80,
            "Saving video information..."
        );


        const databaseResponse =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/videos",

                {
                    method:"POST",

                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=representation"
                    },

                    body:JSON.stringify({

                        title:title,

                        category:category,

                        description:description,

                        video_url:videoURL,

                        thumbnail_url:
                            thumbnailURL,

                        views:0

                    })

                }

            );


        if(!databaseResponse.ok){

            throw new Error(
                await databaseResponse.text()
            );

        }


        setProgress(
            100,
            "Upload complete!"
        );


        status.textContent =
            "✓ Video uploaded successfully.";

        status.className =
            "status success";


        clearForm();


        loadLibrary();

    }
    catch(error){

        console.error(error);

        status.textContent =
            "Upload failed: " +
            error.message;

        status.className =
            "status error";

    }


    button.disabled =
        false;

}


/* ==========================================
   PROGRESS
========================================== */

function setProgress(
    percentage,
    text
){

    document.getElementById(
        "progressBar"
    ).style.width =
        percentage + "%";


    document.getElementById(
        "percent"
    ).textContent =
        percentage + "%";


    document.getElementById(
        "progressText"
    ).textContent =
        text;

}


/* ==========================================
   LOAD LIBRARY
========================================== */

async function loadLibrary(){

    const library =
        document.getElementById(
            "library"
        );


    const empty =
        document.getElementById(
            "empty"
        );


    try{

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/videos?select=*&order=created_at.desc",

                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }

            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        const videos =
            await response.json();


        library.innerHTML =
            "";


        if(videos.length === 0){

            empty.style.display =
                "block";

            return;

        }


        empty.style.display =
            "none";


        videos.forEach(video => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const thumbnail =
                video.thumbnail_url ||
                "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=80";


            card.innerHTML = `

                <img
                    src="${escapeHTML(thumbnail)}"
                >

                <div class="card-body">

                    <h3>
                        ${escapeHTML(video.title)}
                    </h3>

                    <p>
                        ${escapeHTML(video.category)}
                    </p>

                    <p style="margin-top:6px;">
                        ${Number(video.views || 0)}
                        views
                    </p>

                    <button
                        class="delete"
                        onclick="deleteVideo('${video.id}')"
                    >
                        🗑 Delete
                    </button>

                </div>

            `;


            library.appendChild(card);

        });

    }
    catch(error){

        console.error(error);

        empty.textContent =
            "Unable to load video library.";

    }

}


/* ==========================================
   DELETE
========================================== */

async function deleteVideo(id){

    const confirmDelete =
        confirm(
            "Delete this video?"
        );


    if(!confirmDelete)
        return;


    try{

        /* Get video record */

        const response =
            await fetch(

                SUPABASE_URL +
                "/rest/v1/videos?id=eq." +
                id,

                {
                    headers:{
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }

                }

            );


        const records =
            await response.json();


        if(records.length === 0)
            return;


        const video =
            records[0];


        /* --------------------------------
           DELETE DATABASE RECORD
        -------------------------------- */

        await fetch(

            SUPABASE_URL +
            "/rest/v1/videos?id=eq." +
            id,

            {
                method:"DELETE",

                headers:{
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY
                }

            }

        );


        /* --------------------------------
           DELETE VIDEO FILE
        -------------------------------- */

        const videoURL =
            video.video_url;


        if(videoURL){

            const videoPath =
                videoURL.split(
                    "/public/videos/"
                )[1];


            if(videoPath){

                await fetch(

                    SUPABASE_URL +
                    "/storage/v1/object/videos/" +
                    videoPath,

                    {
                        method:"DELETE",

                        headers:{
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY
                        }

                    }

                );

            }

        }


        /* --------------------------------
           DELETE THUMBNAIL
        -------------------------------- */

        if(video.thumbnail_url){

            const thumbnailPath =
                video.thumbnail_url.split(
                    "/public/thumbnails/"
                )[1];


            if(thumbnailPath){

                await fetch(

                    SUPABASE_URL +
                    "/storage/v1/object/thumbnails/" +
                    thumbnailPath,

                    {
                        method:"DELETE",

                        headers:{
                            "apikey":
                                SUPABASE_KEY,

                            "Authorization":
                                "Bearer " +
                                SUPABASE_KEY
                        }

                    }

                );

            }

        }


        loadLibrary();

    }
    catch(error){

        console.error(error);

        alert(
            "Unable to delete video."
        );

    }

}


/* ==========================================
   CLEAR FORM
========================================== */

function clearForm(){

    document.getElementById(
        "title"
    ).value = "";


    document.getElementById(
        "category"
    ).value = "";


    document.getElementById(
        "description"
    ).value = "";


    videoInput.value = "";

    thumbnailInput.value = "";


    document.getElementById(
        "thumbnailPreview"
    ).style.display =
        "none";


    setProgress(
        0,
        "Ready"
    );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(text){

    return String(text)
        .replace(
            /[&<>"']/g,
            function(char){

                return {
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"
                }[char];

            }
        );

}


/* ==========================================
   START
========================================== */

loadLibrary();

</script>

</body>
</html>
