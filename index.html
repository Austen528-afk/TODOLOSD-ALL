<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:white;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,8,8,.96);
    border-bottom:1px solid #252525;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:27px;
    font-weight:900;
}

.logo span{
    color:#ff1744;
}

.admin-link{
    color:#999;
    text-decoration:none;
    font-size:13px;
}

.admin-link:hover{
    color:white;
}

/* HERO */

.hero{
    padding:55px 5% 30px;
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.hero p{
    color:#888;
    max-width:600px;
    line-height:1.6;
}

/* CATEGORIES */

.categories{
    padding:10px 5% 30px;
    display:flex;
    gap:10px;
    overflow-x:auto;
}

.category{
    border:1px solid #333;
    background:#151515;
    color:#aaa;
    padding:9px 16px;
    border-radius:30px;
    cursor:pointer;
    white-space:nowrap;
}

.category:hover,
.category.active{
    background:#ff1744;
    border-color:#ff1744;
    color:white;
}

/* SEARCH */

.search-area{
    padding:0 5% 30px;
}

.search{
    width:100%;
    max-width:600px;
    padding:14px 18px;
    background:#121212;
    border:1px solid #303030;
    border-radius:10px;
    color:white;
    outline:none;
}

.search:focus{
    border-color:#ff1744;
}

/* VIDEO GRID */

.container{
    padding:0 5% 60px;
}

.video-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(260px,1fr));
    gap:22px;
}

/* CARD */

.video-card{
    background:#111;
    border:1px solid #262626;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.video-card:hover{
    transform:translateY(-4px);
    border-color:#444;
}

.thumbnail{
    width:100%;
    height:170px;
    background:#222;
    position:relative;
}

.thumbnail img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.play{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ff1744;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    opacity:.9;
}

.card-body{
    padding:15px;
}

.card-body h3{
    font-size:16px;
    margin-bottom:8px;
}

.card-body p{
    color:#777;
    font-size:12px;
    line-height:1.5;
}

.meta{
    margin-top:12px;
    color:#555;
    font-size:11px;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:70px 20px;
    color:#666;
}

.empty-icon{
    font-size:50px;
    margin-bottom:15px;
}

/* LOADING */

.loading{
    text-align:center;
    padding:60px;
    color:#777;
}

/* VIDEO PLAYER MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.active{
    display:flex;
}

.player{
    width:100%;
    max-width:1000px;
    background:#111;
    border:1px solid #333;
    border-radius:12px;
    overflow:hidden;
}

.player video{
    width:100%;
    max-height:70vh;
    display:block;
    background:#000;
}

.player-info{
    padding:20px;
}

.player-info h2{
    margin-bottom:8px;
}

.player-info p{
    color:#888;
    line-height:1.6;
}

.close{
    position:fixed;
    right:25px;
    top:20px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;
    background:#222;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.close:hover{
    background:#ff1744;
}

/* MOBILE */

@media(max-width:600px){

    .hero h1{
        font-size:30px;
    }

    .hero{
        padding-top:35px;
    }

    .video-grid{
        grid-template-columns:1fr;
    }

    .thumbnail{
        height:210px;
    }

}

</style>

</head>

<body>

<header>

```
<div class="logo">
    Stream<span>X</span>
</div>

<a
    class="admin-link"
    href="admin.html"
>
    Admin
</a>
```

</header>

<section class="hero">

```
<h1>
    Watch what you love.
</h1>

<p>
    Discover and stream the latest videos
    across entertainment, music, sports,
    gaming and more.
</p>
```

</section>

<div class="categories">

```
<button
    class="category active"
    onclick="filterCategory('All',this)"
>
    All
</button>

<button
    class="category"
    onclick="filterCategory('Trending',this)"
>
    🔥 Trending
</button>

<button
    class="category"
    onclick="filterCategory('Entertainment',this)"
>
    🎭 Entertainment
</button>

<button
    class="category"
    onclick="filterCategory('Music',this)"
>
    🎵 Music
</button>

<button
    class="category"
    onclick="filterCategory('Sports',this)"
>
    ⚽ Sports
</button>

<button
    class="category"
    onclick="filterCategory('Gaming',this)"
>
    🎮 Gaming
</button>

<button
    class="category"
    onclick="filterCategory('Education',this)"
>
    🎓 Education
</button>

<button
    class="category"
    onclick="filterCategory('Lifestyle',this)"
>
    ✨ Lifestyle
</button>
```

</div>

<div class="search-area">

```
<input
    class="search"
    id="search"
    placeholder="Search videos..."
    oninput="renderVideos()"
>
```

</div>

<main class="container">

```
<div
    class="loading"
    id="loading"
>
    Loading videos...
</div>

<div
    class="video-grid"
    id="videoGrid"
></div>

<div
    class="empty"
    id="empty"
    style="display:none;"
>

    <div class="empty-icon">
        🎬
    </div>

    <h2>
        No videos found
    </h2>

    <p style="margin-top:8px;">
        Check back later for new content.
    </p>

</div>
```

</main>

<!-- PLAYER -->

<div
    class="modal"
    id="modal"
>

```
<button
    class="close"
    onclick="closePlayer()"
>
    ×
</button>

<div class="player">

    <video
        id="player"
        controls
        playsinline
    ></video>

    <div class="player-info">

        <h2 id="playerTitle"></h2>

        <p id="playerDescription"></p>

    </div>

</div>
```

</div>

<script>

/* ==========================================
   SUPABASE CONFIGURATION
========================================== */

const SUPABASE_URL =
"https://ynmplvnclmolwwvfjidw.supabase.co";

const SUPABASE_KEY =
"sb_publishable_bh7lgrjmQioS58n3-4LdvQ_TAGHCMfy";


/* ==========================================
   VARIABLES
========================================== */

let videos = [];

let selectedCategory = "All";


/* ==========================================
   LOAD VIDEOS
========================================== */

async function loadVideos(){

    const loading =
        document.getElementById("loading");

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/videos?select=*&order=created_at.desc",
                {
                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + SUPABASE_KEY
                    }
                }
            );


        if(!response.ok){

            throw new Error(
                await response.text()
            );

        }


        videos =
            await response.json();


        loading.style.display =
            "none";


        renderVideos();

    }
    catch(error){

        console.error(error);

        loading.innerHTML =
            "Unable to load videos.";

    }

}


/* ==========================================
   RENDER
========================================== */

function renderVideos(){

    const grid =
        document.getElementById(
            "videoGrid"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const search =
        document.getElementById(
            "search"
        ).value.toLowerCase();


    grid.innerHTML = "";


    const filtered =
        videos.filter(video => {

            const categoryMatch =
                selectedCategory === "All" ||
                video.category === selectedCategory;


            const searchMatch =
                video.title
                    .toLowerCase()
                    .includes(search) ||
                (video.description || "")
                    .toLowerCase()
                    .includes(search);


            return categoryMatch &&
                   searchMatch;

        });


    if(filtered.length === 0){

        empty.style.display =
            "block";

        return;

    }


    empty.style.display =
        "none";


    filtered.forEach(video => {

        const card =
            document.createElement("div");


        card.className =
            "video-card";


        const thumbnail =
            video.thumbnail_url ||
            "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=80";


        card.innerHTML = `

            <div class="thumbnail">

                <img
                    src="${escapeHTML(thumbnail)}"
                    alt=""
                >

                <div class="play">
                    ▶
                </div>

            </div>

            <div class="card-body">

                <h3>
                    ${escapeHTML(video.title)}
                </h3>

                <p>
                    ${escapeHTML(
                        video.description || ""
                    )}
                </p>

                <div class="meta">

                    ${escapeHTML(video.category)}
                    ·
                    ${Number(video.views || 0)}
                    views

                </div>

            </div>

        `;


        card.onclick =
            function(){

                openPlayer(video);

            };


        grid.appendChild(card);

    });

}


/* ==========================================
   CATEGORY
========================================== */

function filterCategory(
    category,
    button
){

    selectedCategory =
        category;


    document
        .querySelectorAll(".category")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    renderVideos();

}


/* ==========================================
   OPEN PLAYER
========================================== */

async function openPlayer(video){

    const modal =
        document.getElementById("modal");

    const player =
        document.getElementById("player");


    player.src =
        video.video_url;


    document.getElementById(
        "playerTitle"
    ).textContent =
        video.title;


    document.getElementById(
        "playerDescription"
    ).textContent =
        video.description || "";


    modal.classList.add("active");


    /* Increase view count */

    try{

        await fetch(
            SUPABASE_URL +
            "/rest/v1/videos?id=eq." +
            video.id,
            {
                method:"PATCH",

                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + SUPABASE_KEY,
                    "Content-Type":
                        "application/json",
                    "Prefer":
                        "return=minimal"
                },

                body:JSON.stringify({
                    views:
                        Number(video.views || 0) + 1
                })

            }
        );

    }
    catch(error){

        console.log(
            "View count error:",
            error
        );

    }

}


/* ==========================================
   CLOSE PLAYER
========================================== */

function closePlayer(){

    const modal =
        document.getElementById("modal");

    const player =
        document.getElementById("player");


    player.pause();

    player.src = "";

    modal.classList.remove("active");

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(text){

    return String(text)
        .replace(
            /[&<>"']/g,
            function(char){

                return {
                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"
                }[char];

            }
        );

}


/* ==========================================
   START
========================================== */

loadVideos();

</script>

</body>
</html>
