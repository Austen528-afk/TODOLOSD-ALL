<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>StreamX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#080808;
    color:white;
}

/* =========================
   HEADER
========================= */

header{

    height:70px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 35px;

    background:#101010;

    border-bottom:1px solid #292929;

    position:sticky;

    top:0;

    z-index:100;
}

.logo{

    font-size:27px;

    font-weight:900;
}

.logo span{
    color:#ff1744;
}

.admin-button{

    background:#181818;

    border:1px solid #333;

    color:white;

    padding:10px 16px;

    border-radius:7px;

    cursor:pointer;
}

.admin-button:hover{
    border-color:#ff1744;
}

/* =========================
   MAIN
========================= */

.main{

    max-width:1500px;

    margin:auto;

    padding:35px;
}

.hero{

    margin-bottom:35px;
}

.hero h1{

    font-size:32px;

    margin-bottom:8px;
}

.hero p{

    color:#888;

    font-size:14px;
}

/* =========================
   CATEGORY
========================= */

.categories{

    display:flex;

    gap:10px;

    overflow-x:auto;

    margin-bottom:30px;
}

.category{

    background:#181818;

    border:1px solid #292929;

    color:#aaa;

    padding:9px 16px;

    border-radius:20px;

    cursor:pointer;

    white-space:nowrap;
}

.category:hover,
.category.active{

    background:#ff1744;

    border-color:#ff1744;

    color:white;
}

/* =========================
   VIDEO GRID
========================= */

.video-grid{

    display:grid;

    grid-template-columns:
        repeat(auto-fill,minmax(280px,1fr));

    gap:22px;
}

.video-card{

    background:#111;

    border:1px solid #292929;

    border-radius:10px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;
}

.video-card:hover{

    transform:translateY(-4px);

    background:#181818;
}

.thumbnail{

    width:100%;

    height:170px;

    background:#222;

    position:relative;

    overflow:hidden;
}

.thumbnail img{

    width:100%;

    height:100%;

    object-fit:cover;
}

.category-label{

    position:absolute;

    top:10px;

    left:10px;

    background:rgba(0,0,0,.8);

    padding:5px 8px;

    border-radius:5px;

    font-size:10px;
}

.video-info{

    padding:15px;
}

.video-info h3{

    font-size:16px;

    margin-bottom:8px;
}

.video-info p{

    color:#888;

    font-size:12px;

    line-height:1.5;
}

.watch-button{

    margin-top:12px;

    width:100%;

    background:#ff1744;

    border:none;

    color:white;

    padding:10px;

    border-radius:6px;

    cursor:pointer;

    font-weight:bold;
}

.watch-button:hover{

    background:#e90035;
}

/* =========================
   EMPTY / LOADING
========================= */

.message{

    text-align:center;

    padding:80px 20px;

    color:#777;
}

/* =========================
   VIDEO PLAYER
========================= */

.player-overlay{

    display:none;

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.95);

    z-index:1000;

    overflow-y:auto;

    padding:40px 20px;
}

.player{

    max-width:1000px;

    margin:auto;
}

.close-player{

    background:#222;

    border:1px solid #333;

    color:white;

    width:40px;

    height:40px;

    border-radius:50%;

    cursor:pointer;

    font-size:20px;

    margin-bottom:15px;
}

.player video{

    width:100%;

    max-height:70vh;

    background:#000;

    display:block;
}

.player-info{

    padding:20px 0;
}

.player-info h2{

    font-size:25px;

    margin-bottom:10px;
}

.player-info p{

    color:#999;

    line-height:1.6;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    header{
        padding:0 18px;
    }

    .main{
        padding:25px 15px;
    }

    .hero h1{
        font-size:25px;
    }

    .video-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>


<header>

    <div class="logo">
        Stream<span>X</span>
    </div>

    <button
        class="admin-button"
        onclick="openAdmin()"
    >
        Admin
    </button>

</header>


<main class="main">

    <section class="hero">

        <h1>
            Watch Something Great
        </h1>

        <p>
            Discover the latest videos uploaded to StreamX.
        </p>

    </section>


    <div class="categories">

        <button
            class="category active"
            onclick="filterCategory('All',this)"
        >
            All
        </button>

        <button
            class="category"
            onclick="filterCategory('Trending',this)"
        >
            🔥 Trending
        </button>

        <button
            class="category"
            onclick="filterCategory('Entertainment',this)"
        >
            🎭 Entertainment
        </button>

        <button
            class="category"
            onclick="filterCategory('Music',this)"
        >
            🎵 Music
        </button>

        <button
            class="category"
            onclick="filterCategory('Sports',this)"
        >
            ⚽ Sports
        </button>

        <button
            class="category"
            onclick="filterCategory('Gaming',this)"
        >
            🎮 Gaming
        </button>

        <button
            class="category"
            onclick="filterCategory('Education',this)"
        >
            🎓 Education
        </button>

        <button
            class="category"
            onclick="filterCategory('Lifestyle',this)"
        >
            ✨ Lifestyle
        </button>

    </div>


    <div
        class="video-grid"
        id="videoGrid"
    ></div>


    <div
        class="message"
        id="message"
    >
        Loading videos...
    </div>

</main>


<!-- PLAYER -->

<div
    class="player-overlay"
    id="playerOverlay"
>

    <div class="player">

        <button
            class="close-player"
            onclick="closePlayer()"
        >
            ×
        </button>

        <video
            id="videoPlayer"
            controls
            playsinline
        ></video>

        <div class="player-info">

            <h2 id="playerTitle"></h2>

            <p id="playerDescription"></p>

        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://ynmplvnclmolwwvfjidw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_bh7lgrjmQioS58n3-4LdvQ_TAGHCMfy";


const supabase =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   VARIABLES
===================================================== */

let allVideos = [];

let currentCategory = "All";


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

    const message =
        document.getElementById("message");

    const grid =
        document.getElementById("videoGrid");


    message.style.display =
        "block";

    message.textContent =
        "Loading videos...";


    const { data, error } =
        await supabase
            .from("videos")
            .select("*")
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(error);

        message.textContent =
            "Unable to load videos.";

        return;

    }


    allVideos = data || [];


    renderVideos();

}


/* =====================================================
   RENDER VIDEOS
===================================================== */

function renderVideos(){

    const grid =
        document.getElementById("videoGrid");

    const message =
        document.getElementById("message");


    grid.innerHTML = "";


    let videos;


    if(currentCategory === "All"){

        videos = allVideos;

    }else{

        videos =
            allVideos.filter(
                video =>
                    video.category ===
                    currentCategory
            );

    }


    if(videos.length === 0){

        message.style.display =
            "block";

        message.textContent =
            "No videos available.";

        return;

    }


    message.style.display =
        "none";


    videos.forEach(
        video => {

            const card =
                document.createElement("div");

            card.className =
                "video-card";


            const thumbnail =
                video.thumbnail_url ||
                "https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=900&q=80";


            card.innerHTML = `

                <div class="thumbnail">

                    <img
                        src="${escapeHTML(thumbnail)}"
                        alt="${escapeHTML(video.title)}"
                    >

                    <div class="category-label">

                        ${escapeHTML(video.category || "Video")}

                    </div>

                </div>


                <div class="video-info">

                    <h3>
                        ${escapeHTML(video.title)}
                    </h3>

                    <p>

                        ${escapeHTML(
                            video.description ||
                            "No description available."
                        )}

                    </p>


                    <button
                        class="watch-button"
                    >
                        ▶ Watch Now
                    </button>

                </div>

            `;


            card.querySelector(
                ".watch-button"
            ).onclick =
                function(event){

                    event.stopPropagation();

                    openPlayer(video);

                };


            card.onclick =
                function(){

                    openPlayer(video);

                };


            grid.appendChild(card);

        }
    );

}


/* =====================================================
   CATEGORY FILTER
===================================================== */

function filterCategory(
    category,
    button
){

    currentCategory =
        category;


    document
        .querySelectorAll(".category")
        .forEach(
            btn =>
                btn.classList.remove("active")
        );


    button.classList.add("active");


    renderVideos();

}


/* =====================================================
   PLAYER
===================================================== */

async function openPlayer(video){

    const overlay =
        document.getElementById(
            "playerOverlay"
        );

    const player =
        document.getElementById(
            "videoPlayer"
        );


    document.getElementById(
        "playerTitle"
    ).textContent =
        video.title;


    document.getElementById(
        "playerDescription"
    ).textContent =
        video.description || "";


    player.src =
        video.video_url;


    overlay.style.display =
        "block";


    document.body.style.overflow =
        "hidden";


    /* INCREASE VIEW COUNT */

    await supabase
        .from("videos")
        .update({
            views:
                Number(video.views || 0) + 1
        })
        .eq(
            "id",
            video.id
        );


    video.views =
        Number(video.views || 0) + 1;


    player.play().catch(
        () => {}
    );

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer(){

    const overlay =
        document.getElementById(
            "playerOverlay"
        );

    const player =
        document.getElementById(
            "videoPlayer"
        );


    player.pause();

    player.src = "";


    overlay.style.display =
        "none";


    document.body.style.overflow =
        "";

}


/* =====================================================
   ADMIN PAGE
===================================================== */

function openAdmin(){

    window.location.href =
        "admin.html";

}


/* =====================================================
   SECURITY
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(
            /[&<>"']/g,
            character => {

                return {

                    "&":"&amp;",
                    "<":"&lt;",
                    ">":"&gt;",
                    '"':"&quot;",
                    "'":"&#039;"

                }[character];

            }
        );

}


/* =====================================================
   START
===================================================== */

loadVideos();

</script>

</body>

</html>
