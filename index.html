```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VYBE — Short Videos</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #07070b;
    --card: #111118;
    --text: #ffffff;
    --muted: #9b9ba8;
    --accent: #8b5cf6;
    --accent2: #ec4899;
    --border: rgba(255,255,255,0.08);
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(139,92,246,.15), transparent 35%),
        radial-gradient(circle at top right, rgba(236,72,153,.10), transparent 30%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* HEADER */

header {
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 30px;
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(7,7,11,.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
}

.logo {
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -1px;
    background: linear-gradient(90deg, #8b5cf6, #ec4899);
    -webkit-background-clip: text;
    color: transparent;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.search {
    width: 250px;
    padding: 11px 16px;
    border-radius: 25px;
    border: 1px solid var(--border);
    outline: none;
    background: rgba(255,255,255,.06);
    color: white;
}

.search::placeholder {
    color: #888894;
}

.upload-btn {
    border: none;
    cursor: pointer;
    padding: 11px 18px;
    border-radius: 25px;
    color: white;
    font-weight: bold;
    background: linear-gradient(90deg, #8b5cf6, #ec4899);
    transition: .2s;
}

.upload-btn:hover {
    transform: translateY(-2px);
}

/* CATEGORIES */

.categories {
    display: flex;
    gap: 10px;
    padding: 18px 25px;
    overflow-x: auto;
    scrollbar-width: none;
}

.categories::-webkit-scrollbar {
    display: none;
}

.category {
    flex: 0 0 auto;
    padding: 9px 17px;
    border-radius: 25px;
    background: rgba(255,255,255,.06);
    border: 1px solid var(--border);
    color: #bbb;
    cursor: pointer;
    transition: .2s;
}

.category:hover,
.category.active {
    color: white;
    border-color: transparent;
    background: linear-gradient(90deg, #8b5cf6, #ec4899);
}

/* MAIN */

main {
    max-width: 1400px;
    margin: auto;
    padding: 10px 25px 50px;
}

.section-title {
    font-size: 25px;
    margin: 10px 0 20px;
}

/* VIDEO GRID */

.video-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.video-card {
    position: relative;
    height: 520px;
    border-radius: 20px;
    overflow: hidden;
    background: #111;
    border: 1px solid var(--border);
    cursor: pointer;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.video-card video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #111;
}

.video-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        transparent 45%,
        rgba(0,0,0,.85)
    );
    pointer-events: none;
}

.video-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 18px;
    z-index: 2;
}

.creator {
    font-weight: bold;
    margin-bottom: 8px;
}

.description {
    color: #ddd;
    font-size: 14px;
    line-height: 1.4;
    margin-bottom: 12px;
}

.video-actions {
    display: flex;
    gap: 8px;
}

.action-btn {
    border: none;
    color: white;
    background: rgba(255,255,255,.12);
    padding: 8px 11px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(10px);
}

.action-btn:hover {
    background: rgba(255,255,255,.25);
}

.delete-btn {
    color: #ff7777;
}

.empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
}

/* UPLOAD MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    backdrop-filter: blur(10px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 520px;
    padding: 28px;
    border-radius: 25px;
    background: #12121a;
    border: 1px solid var(--border);
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
}

.modal-box h2 {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #bbb;
    font-size: 14px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #09090e;
    color: white;
    outline: none;
}

.form-group textarea {
    resize: vertical;
    min-height: 90px;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.modal-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.cancel {
    background: #292933;
    color: white;
}

.submit {
    background: linear-gradient(90deg,#8b5cf6,#ec4899);
    color: white;
}

.file-name {
    color: #aaa;
    font-size: 13px;
    margin-top: 7px;
}

/* MOBILE */

@media (max-width: 1100px) {
    .video-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 800px) {

    header {
        padding: 0 15px;
    }

    .search {
        width: 150px;
    }

    .video-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .video-card {
        height: 470px;
    }

    main {
        padding: 5px 12px 40px;
    }

    .categories {
        padding: 15px 12px;
    }
}

@media (max-width: 550px) {

    header {
        height: 60px;
    }

    .logo {
        font-size: 22px;
    }

    .header-right {
        gap: 6px;
    }

    .search {
        width: 115px;
        padding: 9px 12px;
    }

    .upload-btn {
        padding: 9px 12px;
    }

    .video-grid {
        display: block;
    }

    .video-card {
        width: 100%;
        height: calc(100vh - 150px);
        max-height: 700px;
        margin-bottom: 18px;
        border-radius: 18px;
    }

    .section-title {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">VYBE</div>

    <div class="header-right">

        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Search videos..."
        >

        <button class="upload-btn" onclick="openUpload()">
            + Upload
        </button>

    </div>

</header>

<div class="categories" id="categories">

    <div class="category active" data-category="All">
        All
    </div>

    <div class="category" data-category="Entertainment">
        Entertainment
    </div>

    <div class="category" data-category="Sports">
        Sports
    </div>

    <div class="category" data-category="Gaming">
        Gaming
    </div>

    <div class="category" data-category="Music">
        Music
    </div>

    <div class="category" data-category="Education">
        Education
    </div>

    <div class="category" data-category="Technology">
        Technology
    </div>

    <div class="category" data-category="Lifestyle">
        Lifestyle
    </div>

    <div class="category" data-category="Business">
        Business
    </div>

</div>

<main>

    <h1 class="section-title">Discover</h1>

    <div class="video-grid" id="videoGrid"></div>

</main>


<!-- UPLOAD MODAL -->

<div class="modal" id="uploadModal">

    <div class="modal-box">

        <h2>Upload a Video</h2>

        <form id="uploadForm">

            <div class="form-group">

                <label>Video</label>

                <input
                    type="file"
                    id="videoFile"
                    accept="video/*"
                    required
                >

                <div class="file-name" id="fileName">
                    Select a video from your device
                </div>

            </div>

            <div class="form-group">

                <label>Title</label>

                <input
                    type="text"
                    id="videoTitle"
                    placeholder="Enter video title"
                    required
                >

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    id="videoDescription"
                    placeholder="Tell people about your video..."
                ></textarea>

            </div>

            <div class="form-group">

                <label>Category</label>

                <select id="videoCategory">

                    <option>Entertainment</option>
                    <option>Sports</option>
                    <option>Gaming</option>
                    <option>Music</option>
                    <option>Education</option>
                    <option>Technology</option>
                    <option>Lifestyle</option>
                    <option>Business</option>

                </select>

            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel"
                    onclick="closeUpload()"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="submit"
                >
                    Upload Video
                </button>

            </div>

        </form>

    </div>

</div>


<script>

/* =========================================
   DATABASE
========================================= */

let db;

const request = indexedDB.open("VybeVideoDB", 1);

request.onupgradeneeded = function(event) {

    db = event.target.result;

    if (!db.objectStoreNames.contains("videos")) {

        db.createObjectStore("videos", {
            keyPath: "id"
        });

    }
};

request.onsuccess = function(event) {

    db = event.target.result;

    loadVideos();

};

request.onerror = function() {

    console.error("Database error");

};


/* =========================================
   DEFAULT VIDEOS
========================================= */

const demoVideos = [

    {
        id: "demo1",
        title: "Welcome to VYBE",
        description: "Discover amazing short videos.",
        category: "Entertainment",
        creator: "@vybe",
        color: "linear-gradient(135deg,#8b5cf6,#ec4899)"
    },

    {
        id: "demo2",
        title: "Sports Highlights",
        description: "The best sporting moments.",
        category: "Sports",
        creator: "@sports",
        color: "linear-gradient(135deg,#2563eb,#06b6d4)"
    },

    {
        id: "demo3",
        title: "Gaming Moments",
        description: "Epic gaming clips and highlights.",
        category: "Gaming",
        creator: "@gamer",
        color: "linear-gradient(135deg,#16a34a,#22c55e)"
    },

    {
        id: "demo4",
        title: "Learn Something New",
        description: "Quick educational content.",
        category: "Education",
        creator: "@learn",
        color: "linear-gradient(135deg,#f59e0b,#ef4444)"
    }

];


/* =========================================
   STATE
========================================= */

let videos = [];

let selectedCategory = "All";

let searchTerm = "";


/* =========================================
   LOAD VIDEOS
========================================= */

function loadVideos() {

    const transaction = db.transaction(
        ["videos"],
        "readonly"
    );

    const store = transaction.objectStore("videos");

    const getRequest = store.getAll();

    getRequest.onsuccess = function() {

        const uploaded = getRequest.result || [];

        videos = [...demoVideos, ...uploaded];

        renderVideos();

    };

}


/* =========================================
   RENDER VIDEOS
========================================= */

function renderVideos() {

    const grid = document.getElementById("videoGrid");

    grid.innerHTML = "";

    let filtered = videos.filter(video => {

        const categoryMatch =
            selectedCategory === "All" ||
            video.category === selectedCategory;

        const searchMatch =
            video.title.toLowerCase().includes(searchTerm) ||
            video.description.toLowerCase().includes(searchTerm);

        return categoryMatch && searchMatch;

    });


    if (filtered.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                <h2>No videos found</h2>
                <p>Try another category or search.</p>
            </div>
        `;

        return;

    }


    filtered.forEach(video => {

        const card = document.createElement("div");

        card.className = "video-card";

        /* Uploaded videos */

        if (video.blob) {

            const videoURL =
                URL.createObjectURL(video.blob);

            card.innerHTML = `

                <video
                    src="${videoURL}"
                    loop
                    muted
                    playsinline
                    preload="metadata"
                ></video>

                <div class="video-info">

                    <div class="creator">
                        ${escapeHTML(video.creator || "@you")}
                    </div>

                    <div class="description">
                        <strong>${escapeHTML(video.title)}</strong>
                        <br>
                        ${escapeHTML(video.description || "")}
                    </div>

                    <div class="video-actions">

                        <button
                            class="action-btn"
                            onclick="likeVideo('${video.id}', this)"
                        >
                            ❤️ ${video.likes || 0}
                        </button>

                        <button
                            class="action-btn"
                            onclick="shareVideo('${video.id}')"
                        >
                            ↗ Share
                        </button>

                        <button
                            class="action-btn delete-btn"
                            onclick="deleteVideo('${video.id}')"
                        >
                            🗑
                        </button>

                    </div>

                </div>

            `;

        }

        /* Demo videos */

        else {

            card.innerHTML = `

                <div
                    style="
                    width:100%;
                    height:100%;
                    background:${video.color};
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:70px;
                    "
                >
                    ▶
                </div>

                <div class="video-info">

                    <div class="creator">
                        ${video.creator}
                    </div>

                    <div class="description">

                        <strong>
                            ${video.title}
                        </strong>

                        <br>

                        ${video.description}

                    </div>

                    <div class="video-actions">

                        <button
                            class="action-btn"
                            onclick="alert('Demo video')"
                        >
                            ❤️ Like
                        </button>

                        <button
                            class="action-btn"
                            onclick="shareVideo('${video.id}')"
                        >
                            ↗ Share
                        </button>

                    </div>

                </div>

            `;

        }


        grid.appendChild(card);

    });


    setupVideoObserver();

}


/* =========================================
   VIDEO AUTO PLAY
========================================= */

function setupVideoObserver() {

    const observer =
        new IntersectionObserver(

            entries => {

                entries.forEach(entry => {

                    const video =
                        entry.target.querySelector("video");

                    if (!video) return;

                    if (entry.isIntersecting) {

                        video.play().catch(() => {});

                    } else {

                        video.pause();

                    }

                });

            },

            {
                threshold: 0.65
            }

        );


    document
        .querySelectorAll(".video-card")
        .forEach(card => {

            observer.observe(card);

        });

}


/* =========================================
   UPLOAD
========================================= */

function openUpload() {

    document
        .getElementById("uploadModal")
        .classList.add("show");

}

function closeUpload() {

    document
        .getElementById("uploadModal")
        .classList.remove("show");

}


/* =========================================
   FILE NAME
========================================= */

document
    .getElementById("videoFile")
    .addEventListener("change", function() {

        const file = this.files[0];

        document
            .getElementById("fileName")
            .textContent =
            file ? file.name : "Select a video from your device";

    });


/* =========================================
   SAVE UPLOAD
========================================= */

document
    .getElementById("uploadForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const file =
            document.getElementById("videoFile").files[0];

        if (!file) {

            alert("Please select a video.");

            return;

        }


        const newVideo = {

            id:
                Date.now().toString(),

            title:
                document.getElementById("videoTitle").value,

            description:
                document.getElementById("videoDescription").value,

            category:
                document.getElementById("videoCategory").value,

            creator:
                "@you",

            blob:
                file,

            likes:
                0,

            createdAt:
                new Date().toISOString()

        };


        const transaction =
            db.transaction(
                ["videos"],
                "readwrite"
            );

        const store =
            transaction.objectStore("videos");

        store.add(newVideo);


        transaction.oncomplete = function() {

            videos.push(newVideo);

            renderVideos();

            document
                .getElementById("uploadForm")
                .reset();

            document
                .getElementById("fileName")
                .textContent =
                "Select a video from your device";

            closeUpload();

        };

    });


/* =========================================
   DELETE VIDEO
========================================= */

function deleteVideo(id) {

    if (!confirm("Delete this video?")) return;


    const transaction =
        db.transaction(
            ["videos"],
            "readwrite"
        );

    transaction
        .objectStore("videos")
        .delete(id);


    transaction.oncomplete = function() {

        videos =
            videos.filter(video =>
                video.id !== id
            );

        renderVideos();

    };

}


/* =========================================
   LIKE VIDEO
========================================= */

function likeVideo(id, button) {

    const video =
        videos.find(v => v.id === id);

    if (!video) return;

    video.likes =
        (video.likes || 0) + 1;


    button.innerHTML =
        `❤️ ${video.likes}`;


    const transaction =
        db.transaction(
            ["videos"],
            "readwrite"
        );

    transaction
        .objectStore("videos")
        .put(video);

}


/* =========================================
   SHARE
========================================= */

function shareVideo(id) {

    const video =
        videos.find(v => v.id === id);

    if (!video) return;


    const shareData = {

        title: video.title,

        text: video.description,

        url: window.location.href

    };


    if (navigator.share) {

        navigator.share(shareData);

    } else {

        navigator.clipboard
            .writeText(window.location.href)
            .then(() => {

                alert("Link copied!");

            });

    }

}


/* =========================================
   CATEGORY FILTER
========================================= */

document
    .getElementById("categories")
    .addEventListener("click", function(event) {

        const category =
            event.target.closest(".category");

        if (!category) return;


        document
            .querySelectorAll(".category")
            .forEach(button =>
                button.classList.remove("active")
            );


        category.classList.add("active");


        selectedCategory =
            category.dataset.category;


        renderVideos();

    });


/* =========================================
   SEARCH
========================================= */

document
    .getElementById("searchInput")
    .addEventListener("input", function() {

        searchTerm =
            this.value.toLowerCase().trim();

        renderVideos();

    });


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text || "";

    return div.innerHTML;

}


/* =========================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================= */

document
    .getElementById("uploadModal")
    .addEventListener("click", function(event) {

        if (event.target === this) {

            closeUpload();

        }

    });

</script>

</body>
</html>
```
